name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: shellcheck
        run: shellcheck -s sh commit-issue-prefix.sh tests/test.sh

      - name: Tests (sh)
        run: sh tests/test.sh

      - name: Tests (bash)
        run: bash tests/test.sh

      - name: Tests (dash)
        if: runner.os == 'Linux'
        run: dash tests/test.sh

  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Tests (Git for Windows sh)
        run: sh tests/test.sh

      - name: Tests (Git for Windows bash)
        run: bash tests/test.sh

  prek-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install prek
        run: pipx install prek

      - name: Run the hook through prek on an issue branch
        run: |
          git config user.name ci
          git config user.email ci@example.com
          git checkout -b 'feat/#111'
          printf 'Add feature\n' > "$RUNNER_TEMP/MSG"
          prek try-repo . commit-issue-prefix \
            --hook-stage prepare-commit-msg \
            --commit-msg-filename "$RUNNER_TEMP/MSG" \
            --all-files
          cat "$RUNNER_TEMP/MSG"
          test "$(head -n 1 "$RUNNER_TEMP/MSG")" = '[#111] Add feature'
